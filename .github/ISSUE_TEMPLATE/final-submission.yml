name: "LoomQ 最终提交"
description: "提交 fork 仓库和完整 commit SHA；截止前可通过新 Issue 重新提交"
title: "[Final Submission] "
body:
  - type: markdown
    attributes:
      value: |
        截止时间：**2026-08-25 12:00 UTC+8**。请先在 fork 中运行 `python3 starter_kit/prepare_submission.py --team-id <GITHUB_USERNAME>`。

        本届不使用预登记名单：Team ID 必须填写当前 Issue 作者的 GitHub 用户名，fork 也必须归该账号所有。

        Issue 创建后不能通过编辑来更换提交。如需更新，请重新创建 Issue；截止前最后一次通过校验的提交生效。
  - type: input
    id: team_id
    attributes:
      label: Team ID
      description: 填写当前 Issue 作者的 GitHub 用户名；大小写不敏感。
      placeholder: your-github-username
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Fork repository
      description: 必须是 QAIDAO/LoomQ-2026 fork network 中的公开仓库。
      placeholder: https://github.com/your-account/LoomQ-2026
    validations:
      required: true
  - type: input
    id: commit_sha
    attributes:
      label: Commit SHA
      description: 请填写 `git rev-parse HEAD` 输出的 40 位完整 SHA。
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: checkboxes
    id: levels
    attributes:
      label: Levels
      description: 选择与 starter_kit/submission.yaml 一致的参赛 Level。
      options:
        - label: L1
        - label: L2
        - label: L3
    validations:
      required: true
  - type: input
    id: hardware_evidence
    attributes:
      label: Hardware evidence
      description: 如申报真机分，填写 fork 中的证据目录；否则留空。
      placeholder: starter_kit/evidence/hardware/
  - type: checkboxes
    id: declarations
    attributes:
      label: Declarations
      options:
        - label: I agree that this commit is the team's own submission and the team can explain its implementation.
          required: true
        - label: I agree that the organizers may archive, build, execute, and review this commit for competition judging.
          required: true
        - label: I agree that the GitHub Issue creation time is the authoritative submission time.
          required: true
    validations:
      required: true
