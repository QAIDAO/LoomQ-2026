name: Submission tools tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compile submission tools
        run: python3 -m py_compile competition/*.py starter_kit/prepare_submission.py

      - name: Run submission tooling tests
        run: python3 -m unittest discover -s tests -v
